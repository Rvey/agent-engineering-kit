# policy — no-AI gate for the agent loop.
#
# Fails a PR when:
#   1. the PR body lacks real Gates / Deslop evidence (Security when the diff
#      touches sensitive paths, Tests when it touches test files);
#   2. added test lines exceed TEST_RATIO_MAX times the added production
#      lines without a `Ratio:` line under ## Tests;
#   3. added code introduces suppressions (eslint-disable, # noqa,
#      @ts-ignore) without a written reason;
#   4. AGENTS.md is missing or still the kit template;
#   5. ## Risk is not low/medium/high, is below high on a high-risk path, or
#      a high-risk change has fewer than HIGH_RISK_APPROVALS human approvals
#      on its latest commit (bot and pre-push approvals do not count).
#
# Enforce it: branch protection -> require the "policy / loop evidence" check.
# Bypass: maintainers apply the `policy:skip` label (the job is skipped), or
# an added line carries `policy:allow`.
#
# Configure the env block below; the check logic lives in
# .github/scripts/policy-check.sh.
name: policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
  # Re-run when reviews change, so the approval count stays current.
  pull_request_review:
    types: [submitted, dismissed]

# One run per PR at a time: a slower, older run must not finish last and
# overwrite the result of a newer one (for example after a new approval).
concurrency:
  group: policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  loop-evidence:
    name: loop evidence
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'policy:skip') }}
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      # Comma-separated PR body sections that must have content.
      REQUIRED_SECTIONS: 'Gates,Deslop,How to revert'
      # Section whose first word must be low, medium or high. Empty turns the
      # risk check off; the approval rule below still applies to its paths.
      RISK_SECTION: 'Risk'
      # Paths that force Risk: high, on top of SENSITIVE_PATTERNS:
      # CI and release workflows, the policy script, hooks, installers.
      HIGH_RISK_PATTERNS: '(^|/)\.github/(workflows|scripts)/|(^|/)\.agents/hooks/|(^|/)[^/]*install[^/]*\.(sh|ps1)$|(^|/)release[^/]*\.(ya?ml|sh)$'
      # Human approvals a high-risk PR needs on its latest commit, counted
      # whenever risk is high or the diff touches SENSITIVE_PATTERNS or
      # HIGH_RISK_PATTERNS. Lower this to 1 (or 0) in a repository with fewer
      # than two maintainers.
      HIGH_RISK_APPROVALS: '2'
      # Extra section required when sensitive paths changed.
      SECURITY_SECTION: 'Security'
      # Paths that force the security sign-off section.
      SENSITIVE_PATTERNS: '(^|/)(auth|payments?|billing|secrets?|credentials?|uploads?|webhooks?)(/|\.|$)|(^|/)\.env(\..+)?$'
      # File extensions scanned for unexplained suppressions.
      SCAN_EXTENSIONS: '*.ts *.tsx *.js *.jsx *.mjs *.cjs *.py *.rb *.go *.rs *.java *.kt *.css *.scss *.vue *.svelte'
      # Test files: changing one requires a ## Tests section in the PR body.
      TESTS_SECTION: 'Tests'
      TEST_PATTERNS: '(^|/)(tests?|__tests__|specs?|e2e)/|[._-](test|spec)s?\.[a-z0-9]+$|(^|/)test_[^/]+\.py$'
      # Added test lines may be at most this many times the added production
      # lines (docs excluded) before a "Ratio:" note is required; changes with
      # fewer than TEST_RATIO_MIN_LINES added test lines are exempt.
      TEST_RATIO_MAX: '2'
      TEST_RATIO_MIN_LINES: '40'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Fetch PR body
        run: gh pr view "$PR_NUMBER" --json body --jq '.body' > "$RUNNER_TEMP/pr-body.md"
      - name: Fetch reviews
        run: >-
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews"
          --jq '.[] | [.user.login, .user.type, .state, .commit_id] | @tsv'
          > "$RUNNER_TEMP/reviews.tsv"
      - name: Run policy check
        env:
          PR_BODY_FILE: ${{ runner.temp }}/pr-body.md
          REVIEWS_FILE: ${{ runner.temp }}/reviews.tsv
        run: bash .github/scripts/policy-check.sh
