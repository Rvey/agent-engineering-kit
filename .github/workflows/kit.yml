name: kit checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static:
    name: static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Syntax, shellcheck, skills, links
        run: bash scripts/lint.sh
      - name: Workflow syntax
        uses: docker://rhysd/actionlint:1.7.12
      - name: Kit self-check
        run: bash scripts/setup-check.sh --kit

  smoke:
    name: install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise installation and policy
        run: bash tests/setup-smoke.sh
